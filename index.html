<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รางวัลที่ 1 ออกอะไรบ้าง?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafaf7; --ink:#1d2433; --mute:#6b7385; --line:#e3e5ea; --hit:#3b3fd8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "IBM Plex Sans Thai", system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  h2 { font-size:1.1rem; margin:32px 0 8px; }
  .sub, .note { color:var(--mute); font-size:.9rem; margin:4px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  button, input { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:6px 14px; }
  button { cursor:pointer; }
  button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--hit); outline-offset:2px; }
  .top { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; text-align:center; }
  .top div { border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 2px; }
  .top b { display:block; font-size:1.5rem; color:var(--hit); line-height:1.2; }
  .top small { color:var(--mute); font-size:.72rem; }
  .grid .c.max { outline:2px solid var(--ink); outline-offset:-2px; font-weight:600; }
  .grid .m { font-size:.85rem; padding-top:6px; }
  .grid { display:grid; grid-template-columns:2rem repeat(6, 1fr); gap:3px; text-align:center; font-variant-numeric:tabular-nums; }
  .grid .h { color:var(--mute); font-size:.78rem; align-self:center; }
  .grid .c { border-radius:4px; padding:6px 0; font-size:.9rem; background:#eceef3; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mute); font-weight:400; font-size:.85rem; }
  td.num { letter-spacing:.1em; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>รางวัลที่ 1 ออกอะไรบ้าง?</h1>
  <p class="sub" id="range">กำลังโหลด…</p>

  <div class="row" id="years">
    <button data-y="5" aria-pressed="false">5 ปี</button>
    <button data-y="10" aria-pressed="false">10 ปี</button>
    <button data-y="40" aria-pressed="true">ทั้งหมด</button>
  </div>

  <h2>เลขที่ออกบ่อยที่สุดในแต่ละหลัก</h2>
  <div class="top" id="top"></div>

  <h2>จำนวนครั้งของตัวเลข 0–9 ในแต่ละหลัก</h2>
  <div class="grid" id="grid" aria-label="ตารางจำนวนครั้งของตัวเลข 0-9 ในแต่ละหลัก"></div>
  <p class="note" id="gridnote"></p>

  <h2>ประวัติรางวัลที่ 1</h2>
  <table><thead><tr><th>วันที่</th><th>เลข</th></tr></thead><tbody id="hist"></tbody></table>
  <div class="row"><button id="more">ดูทั้งหมด</button></div>

  <p class="note">หวยแต่ละงวดสุ่มแยกกัน สถิติย้อนหลังไม่ได้ช่วยทำนายงวดถัดไป ใช้ดูเป็นข้อมูลเท่านั้น</p>
</main>

<script>
const state = { years: 40, draws: [], showAll: false };
const $ = id => document.getElementById(id);
const fmt = iso => new Date(iso).toLocaleDateString("th-TH", { day:"numeric", month:"short", year:"numeric" });

fetch("data/draws.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(d => { state.draws = d; render(); })
  .catch(() => { $("range").textContent = "โหลดข้อมูลไม่ได้ ลองรีเฟรชอีกครั้ง"; });

function stats(draws) {
  const counts = Array.from({ length: 6 }, () => Array(10).fill(0));
  for (const d of draws) [...d.first].forEach((ch, i) => counts[i][+ch]++);
  const n = draws.length;
  const tops = counts.map(col => {
    const m = Math.max(...col);
    return { m, digits: col.flatMap((c, dg) => c === m ? [dg] : []) };
  });
  const means = counts.map(col => n ? col.reduce((s, c, dg) => s + c * dg, 0) / n : 0);
  return { counts, tops, means, n };
}

function render() {
  const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear() - state.years);
  const draws = state.draws.filter(d => new Date(d.date) >= cutoff);
  $("range").textContent = draws.length
    ? `${fmt(draws[0].date)} – ${fmt(draws.at(-1).date)} รวม ${draws.length} งวด`
    : "ไม่มีข้อมูลในช่วงนี้";

  const { counts, tops, means, n } = stats(draws);
  $("top").innerHTML = tops.map((t, i) =>
    `<div><small>หลัก ${i + 1}</small><b>${n ? t.digits.join("/") : "-"}</b><small>${n ? `${t.m} ครั้ง (${(100 * t.m / n).toFixed(1)}%)` : ""}</small></div>`).join("");

  const max = Math.max(1, ...counts.flat());
  let html = "<span></span>" + [1,2,3,4,5,6].map(i => `<span class="h">หลัก ${i}</span>`).join("");
  for (let dg = 0; dg < 10; dg++) {
    html += `<span class="h">${dg}</span>`;
    for (let p = 0; p < 6; p++) {
      const c = counts[p][dg], a = 0.08 + 0.85 * c / max;
      html += `<span class="c${n && c === tops[p].m ? " max" : ""}" style="background:rgba(59,63,216,${a.toFixed(2)});color:${a > 0.5 ? "#fff" : "inherit"}">${c}</span>`;
    }
  }
  html += `<span class="h m">เฉลี่ย</span>` + means.map(m => `<span class="m">${n ? m.toFixed(2) : "-"}</span>`).join("");
  $("grid").innerHTML = html;
  $("gridnote").textContent = n
    ? `หลัก 1 คือหลักซ้ายสุด หลัก 6 คือหลักขวาสุด ช่องที่มีกรอบคือเลขที่ออกบ่อยสุดของหลักนั้น ถ้าสุ่มสมบูรณ์ แต่ละช่องควรได้ราว ${(n / 10).toFixed(0)} ครั้ง และค่าเฉลี่ยควรใกล้ 4.50 ส่วนที่ต่างเล็กน้อยเป็นเรื่องปกติ` : "";

  const list = draws.slice().reverse();
  const shown = state.showAll ? list : list.slice(0, 20);
  $("hist").innerHTML = shown.map(d => `<tr><td>${fmt(d.date)}</td><td class="num">${d.first}</td></tr>`).join("");
  $("more").hidden = state.showAll || list.length <= 20;
}

$("more").addEventListener("click", () => { state.showAll = true; render(); });
document.querySelectorAll("#years button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#years button").forEach(x => x.setAttribute("aria-pressed", x === b));
  state.years = +b.dataset.y; render();
}));
</script>
</body>
</html>
